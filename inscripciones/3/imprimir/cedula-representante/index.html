        (() => {

            const pages = document.querySelectorAll('.page');

            document.querySelectorAll('.doc').forEach(doc => {

                const propias = doc.querySelectorAll('.page');

                propias.forEach((p, k) => {

                    const n = [...pages].indexOf(p) + 1;

                    const tag = document.createElement('div');

                    tag.className = 'hoja-num';

                    tag.innerHTML = `<b>Hoja ${n} de ${pages.length}</b> · ${doc.dataset.nombre}` +

                        (propias.length > 1 ? ` (${k + 1}/${propias.length})` : '');

                    p.before(tag);

                });

            });

        })();

<script>
(function(){
  var P = '/polimil-demo';
  function toast(t){var e=document.getElementById('demo-toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none'},3200);}
  document.addEventListener('submit', function(ev){
    var f = ev.target, a = (f.getAttribute('action')||'');
    ev.preventDefault(); ev.stopImmediatePropagation();
    f.querySelectorAll('button').forEach(function(b){b.disabled=false});
    if (/\/login\/?$/.test(a)) {
      // Igual que el sistema real: el destino lo decide el ROL del usuario, no la pestaña
      // (la demo no guarda claves: solo mira qué usuario es)
      var u = ((f.querySelector('[name=username]') || {}).value || '').trim().toLowerCase();
      if (u === 'admin' || u === 'asesor' || u === 'polimil') { location.href = P + '/app/'; return; }
      if (/^\d{10}$/.test(u)) { location.href = P + '/mi-cuenta/'; return; }
      var t = f.querySelector('[name=tipo]');
      toast((t && t.value === 'cadete') ? 'Cédula o clave incorrectas.' : 'Usuario o clave incorrectos.'); return;
    }
    if (/\/logout\/?$/.test(a)) { location.href = P + '/login/'; return; }
    toast('Esta es una versión de demostración: los cambios no se guardan.');
  }, true);
})();
</script>
